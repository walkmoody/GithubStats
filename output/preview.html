<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GithubStats preview</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  section { padding: 32px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .dark { background: #0d1117; color: #e6edf3; }
  .light { background: #ffffff; color: #1f2328; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; }
  img { max-width: 100%; }
</style>
</head>
<body>
  <section class="dark">
    <h2>Dark theme</h2>
    <img src="stats-dark.svg" alt="stats-dark.svg">
    <img src="languages-dark.svg" alt="languages-dark.svg">
    <img src="streak-dark.svg" alt="streak-dark.svg">
  </section>
  <section class="light">
    <h2>Light theme</h2>
    <img src="stats-light.svg" alt="stats-light.svg">
    <img src="languages-light.svg" alt="languages-light.svg">
    <img src="streak-light.svg" alt="streak-light.svg">
  </section>
</body>
</html>
