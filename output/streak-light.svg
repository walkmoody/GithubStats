<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-labelledby="card-title">
  <title id="card-title">Walker Moody&#39;s contribution streaks</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .title { font-size: 18px; font-weight: 600; fill: #13223A; }
    .sub { font-size: 12px; fill: #5B6B82; }
    .num { font-size: 22px; font-weight: 600; fill: #13223A; }
    .big { font-size: 28px; font-weight: 600; fill: #13223A; }
    .label { font-size: 12px; fill: #5B6B82; }
    .small { font-size: 11px; fill: #5B6B82; }
    .item { font-size: 13px; fill: #13223A; }
  </style>
  <rect x="0.5" y="0.5" width="559" height="149" rx="10" fill="#F7F9FC" stroke="#DCE3EE"/>
  <text class="title" x="28" y="42">Streaks</text>
  <g transform="translate(28.0 0)">
    <text x="0" y="86"><tspan class="big" style="fill:#0E7AB8">11</tspan><tspan class="label" dx="6">days</tspan></text>
    <text class="item" y="108">Current streak</text>
    <text class="small" y="126">Nov 1 to Nov 11</text>
  </g>
  <g transform="translate(196.0 0)">
    <text x="0" y="86"><tspan class="big">13</tspan><tspan class="label" dx="6">days</tspan></text>
    <text class="item" y="108">Longest streak</text>
    <text class="small" y="126">Mar 1 to Mar 13</text>
  </g>
  <g transform="translate(364.0 0)">
    <text x="0" y="86"><tspan class="big">166</tspan><tspan class="label" dx="6">of 369</tspan></text>
    <text class="item" y="108">Active days</text>
    <text class="small" y="126">45% of the last year</text>
  </g>
</svg>
