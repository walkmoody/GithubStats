<svg xmlns="http://www.w3.org/2000/svg" width="560" height="206" viewBox="0 0 560 206" role="img" aria-labelledby="card-title">
  <title id="card-title">Most used languages</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .title { font-size: 18px; font-weight: 600; fill: #E6EDF7; }
    .sub { font-size: 12px; fill: #8A9BB4; }
    .num { font-size: 22px; font-weight: 600; fill: #E6EDF7; }
    .big { font-size: 28px; font-weight: 600; fill: #E6EDF7; }
    .label { font-size: 12px; fill: #8A9BB4; }
    .small { font-size: 11px; fill: #8A9BB4; }
    .item { font-size: 13px; fill: #E6EDF7; }
  </style>
  <rect x="0.5" y="0.5" width="559" height="205" rx="10" fill="#0F1A2B" stroke="#1F2E45"/>
  <text class="title" x="28" y="42">Languages</text>
  <clipPath id="bar"><rect x="28" y="60" width="504" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="28.0" y="60" width="167.6" height="10" fill="#DA5B0B"/>
    <rect x="197.6" y="60" width="112.8" height="10" fill="#f1e05a"/>
    <rect x="312.4" y="60" width="77.3" height="10" fill="#e34c26"/>
    <rect x="391.7" y="60" width="67.4" height="10" fill="#555555"/>
    <rect x="461.0" y="60" width="37.7" height="10" fill="#3572A5"/>
    <rect x="500.7" y="60" width="25.2" height="10" fill="#f34b7d"/>
    <rect x="528.0" y="60" width="4.0" height="10" fill="#8A9BB4"/>
  </g>
  <circle cx="33" cy="98" r="5" fill="#DA5B0B"/>
  <text class="item" x="46" y="102">Jupyter Notebook</text>
  <text class="label" x="256" y="102" text-anchor="end">34%</text>
  <circle cx="33" cy="124" r="5" fill="#f1e05a"/>
  <text class="item" x="46" y="128">JavaScript</text>
  <text class="label" x="256" y="128" text-anchor="end">23%</text>
  <circle cx="33" cy="150" r="5" fill="#e34c26"/>
  <text class="item" x="46" y="154">HTML</text>
  <text class="label" x="256" y="154" text-anchor="end">16%</text>
  <circle cx="33" cy="176" r="5" fill="#555555"/>
  <text class="item" x="46" y="180">C</text>
  <text class="label" x="256" y="180" text-anchor="end">14%</text>
  <circle cx="285" cy="98" r="5" fill="#3572A5"/>
  <text class="item" x="298" y="102">Python</text>
  <text class="label" x="508" y="102" text-anchor="end">7.9%</text>
  <circle cx="285" cy="124" r="5" fill="#f34b7d"/>
  <text class="item" x="298" y="128">C++</text>
  <text class="label" x="508" y="128" text-anchor="end">5.4%</text>
  <circle cx="285" cy="150" r="5" fill="#8A9BB4"/>
  <text class="item" x="298" y="154">Other</text>
  <text class="label" x="508" y="154" text-anchor="end">&lt;1%</text>
</svg>
