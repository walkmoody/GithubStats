<svg xmlns="http://www.w3.org/2000/svg" width="560" height="206" viewBox="0 0 560 206" role="img" aria-labelledby="card-title">
  <title id="card-title">Most used languages</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .title { font-size: 18px; font-weight: 600; fill: #E6EDF7; }
    .sub { font-size: 12px; fill: #8A9BB4; }
    .num { font-size: 22px; font-weight: 600; fill: #E6EDF7; }
    .big { font-size: 28px; font-weight: 600; fill: #E6EDF7; }
    .label { font-size: 12px; fill: #8A9BB4; }
    .small { font-size: 11px; fill: #8A9BB4; }
    .item { font-size: 13px; fill: #E6EDF7; }
  </style>
  <rect x="0.5" y="0.5" width="559" height="205" rx="10" fill="#0F1A2B" stroke="#1F2E45"/>
  <text class="title" x="28" y="42">Languages</text>
  <clipPath id="bar"><rect x="28" y="60" width="504" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="28.0" y="60" width="268.9" height="10" fill="#4f87c4"/>
    <rect x="298.9" y="60" width="89.3" height="10" fill="#f1e05a"/>
    <rect x="390.2" y="60" width="68.6" height="10" fill="#555555"/>
    <rect x="460.8" y="60" width="33.5" height="10" fill="#3572A5"/>
    <rect x="496.3" y="60" width="25.8" height="10" fill="#f34b7d"/>
    <rect x="524.1" y="60" width="1.0" height="10" fill="#3178c6"/>
    <rect x="526.2" y="60" width="5.8" height="10" fill="#8A9BB4"/>
  </g>
  <circle cx="33" cy="98" r="5" fill="#4f87c4"/>
  <text class="item" x="46" y="102">V</text>
  <text class="label" x="256" y="102" text-anchor="end">54%</text>
  <circle cx="33" cy="124" r="5" fill="#f1e05a"/>
  <text class="item" x="46" y="128">JavaScript</text>
  <text class="label" x="256" y="128" text-anchor="end">18%</text>
  <circle cx="33" cy="150" r="5" fill="#555555"/>
  <text class="item" x="46" y="154">C</text>
  <text class="label" x="256" y="154" text-anchor="end">14%</text>
  <circle cx="33" cy="176" r="5" fill="#3572A5"/>
  <text class="item" x="46" y="180">Python</text>
  <text class="label" x="256" y="180" text-anchor="end">7.0%</text>
  <circle cx="285" cy="98" r="5" fill="#f34b7d"/>
  <text class="item" x="298" y="102">C++</text>
  <text class="label" x="508" y="102" text-anchor="end">5.5%</text>
  <circle cx="285" cy="124" r="5" fill="#3178c6"/>
  <text class="item" x="298" y="128">TypeScript</text>
  <text class="label" x="508" y="128" text-anchor="end">&lt;1%</text>
  <circle cx="285" cy="150" r="5" fill="#8A9BB4"/>
  <text class="item" x="298" y="154">Other</text>
  <text class="label" x="508" y="154" text-anchor="end">1.2%</text>
</svg>
